# Server (PORT is set automatically by hosts like Render/Railway)
server.port=${PORT:8080}

# Database — override with environment variables in production
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clubmanager_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson: send dates as ISO strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# App
spring.application.name=clubmanager

# JWT (HS512 needs a secret of at least 64 characters)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=86400000

# Rotating QR check-in secret (falls back to the JWT secret if not set)
app.totp.secret=${TOTP_SECRET:${APP_JWT_SECRET}}
